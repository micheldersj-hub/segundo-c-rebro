# Instala/atualiza dependências do app iOS com versões compatíveis (npx expo install) e faz commit no branch escolhido.
# Existe porque a sessão de desenvolvimento pode não ter acesso ao npm. Disparo manual.
name: iOS — dependências
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
        default: ios-dev
      pacotes:
        description: 'Pacotes separados por espaço (vazio = só corrigir versões)'
        required: false
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACOTES: ${{ inputs.pacotes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        working-directory: ios
        run: |
          for p in $PACOTES; do [[ "$p" =~ ^[@a-z0-9./_-]+$ ]] || { echo "nome inválido: $p"; exit 1; }; done
          npm ci
          if [ -n "$PACOTES" ]; then npx --yes expo install $PACOTES; fi
          npx --yes expo install --fix
          npx --yes expo-doctor || true
      - name: Commit
        run: |
          git config user.name "dimy-bot"; git config user.email "dimy-bot@users.noreply.github.com"
          git add ios/package.json ios/package-lock.json
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          git commit -m "iOS: dependências (${PACOTES:-correção de versões})"
          git push origin HEAD:${{ inputs.branch }}
