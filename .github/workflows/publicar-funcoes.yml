# Publica funções no Supabase a partir do repositório (sem colar código na conversa).
# Só roda quando alguém dispara à mão (Actions › Publicar funções › Run workflow) ou via API.
# Requer o segredo SUPABASE_ACCESS_TOKEN (Settings › Secrets and variables › Actions), criado pelo dono.
name: Publicar funções
on:
  workflow_dispatch:
    inputs:
      funcoes:
        description: 'Funções separadas por espaço (ex.: olho tarefas)'
        required: true
permissions:
  contents: read
concurrency:
  group: publicar-funcoes
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: mavjbevuhzalkqyxaajw
      FUNCOES: ${{ inputs.funcoes }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredo e nomes
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Falta o segredo SUPABASE_ACCESS_TOKEN no repositório."; exit 1; }
          for f in $FUNCOES; do
            [[ "$f" =~ ^[a-z0-9-]{2,40}$ ]] || { echo "Nome inválido: $f"; exit 1; }
            [ -f "supabase/functions/$f/index.ts" ] || { echo "Função não existe no repositório: $f"; exit 1; }
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        run: |
          for f in $FUNCOES; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJETO" --no-verify-jwt --yes
            echo "::endgroup::"
          done
