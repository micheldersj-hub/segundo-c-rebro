name: Testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5.6.3
      - name: Sintaxe dos bundles minificados
        run: |
          for f in supabase/functions/*/index.ts; do
            head -c 400 "$f" | grep -q '^// @ts-nocheck' || continue
            grep -qE '^(import|var|async function)' <(sed -n 2p "$f") || continue
            cp "$f" "/tmp/$(basename $(dirname $f)).mjs" && node --check "/tmp/$(basename $(dirname $f)).mjs" || { echo "falha de sintaxe: $f"; exit 1; }
          done
      - name: Testes de unidade
        run: cd supabase && node --test tests/*.test.mjs
